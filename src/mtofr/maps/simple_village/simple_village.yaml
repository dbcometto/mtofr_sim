map:
  name: "simple_village"
  cosmetic_image_path: "simple_village_cosmetic"
  traversability_image_path: "simple_village_traversability"
  regions_image_path: "simple_village_regions"
  meters_per_pixel: 0.5

traversability:
  # Color: {name, blocking, speed_multiplier}
  "#ff0000":
    name: "blocked"
    blocking: true
    speed_multiplier: 0.0
  "#00ff00":
    name: "road"
    blocking: false
    speed_multiplier: 1.0
  "#0000ff":
    name: "clear"
    blocking: false
    speed_multiplier: 0.6

regions:
  # Color: {name, center_x, center_y (pixel coords from top left)}
  "#ff0000": # red
    name: "A"
    center_x: 30.0
    center_y: 80.0

  "#00ff00": # green
    name: "B"
    center_x: 170.0
    center_y: 140.0

  "#0000ff": # blue
    name: "C"
    center_x: 30.0
    center_y: 210.0

  "#ffff00": # yellow
    name: "D"
    center_x: 234.0
    center_y: 140.0